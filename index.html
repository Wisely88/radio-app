<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>小伟网络电台</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg: #08101d;
      --panel: #101a2a;
      --panel-2: #152238;
      --panel-3: #1b2a42;
      --text: #eef6ff;
      --muted: #93a7bf;
      --line: #263a56;
      --accent: #29d3e2;
      --accent-strong: #08aebf;
      --success: #55d98b;
      --warning: #ffbd66;
      --danger: #ff7185;
      --focus: 0 0 0 3px rgba(41, 211, 226, .24);
      --shadow: 0 18px 50px rgba(0, 0, 0, .26);
    }

    * { box-sizing: border-box; }

    html { color-scheme: dark; }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 0%, rgba(41, 211, 226, .09), transparent 32rem),
        linear-gradient(180deg, #091321 0%, var(--bg) 100%);
    }

    button, input { font: inherit; }

    button:focus-visible, input:focus-visible {
      outline: none;
      box-shadow: var(--focus);
    }

    .app {
      width: min(1240px, calc(100% - 32px));
      margin: 0 auto;
      padding: 20px 0 40px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      flex: 0 0 auto;
      border: 1px solid rgba(41, 211, 226, .48);
      border-radius: 12px;
      color: #071018;
      background: linear-gradient(145deg, #51e7ee, #26becd);
      box-shadow: 0 10px 30px rgba(41, 211, 226, .18);
      font-size: 23px;
    }

    h1 {
      margin: 0;
      font-size: clamp(20px, 3vw, 28px);
      line-height: 1.2;
      letter-spacing: .02em;
    }

    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .top-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(16, 26, 42, .78);
      font-size: 12px;
      white-space: nowrap;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }

    .status-dot.playing { background: var(--success); box-shadow: 0 0 10px rgba(85, 217, 139, .8); }
    .status-dot.loading { background: var(--warning); animation: pulse 1s ease-in-out infinite; }
    .status-dot.error { background: var(--danger); box-shadow: 0 0 10px rgba(255, 113, 133, .55); }

    @keyframes pulse { 50% { opacity: .4; } }

    .shell {
      display: grid;
      grid-template-columns: minmax(320px, 380px) minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(16, 26, 42, .94);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .player {
      position: sticky;
      top: 18px;
      padding: 22px;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .live-badge {
      padding: 4px 8px;
      border: 1px solid rgba(85, 217, 139, .34);
      border-radius: 999px;
      color: var(--success);
      background: rgba(85, 217, 139, .08);
      letter-spacing: .04em;
    }

    .now-playing {
      min-height: 145px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: linear-gradient(145deg, rgba(41, 211, 226, .08), rgba(21, 34, 56, .55));
    }

    .now-category {
      margin-bottom: 10px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 750;
    }

    .station-name {
      margin: 0 0 8px;
      font-size: 23px;
      line-height: 1.3;
    }

    .station-desc {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .main-control {
      display: grid;
      grid-template-columns: 48px 1fr 48px;
      gap: 9px;
      margin-top: 16px;
    }

    .btn {
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--text);
      background: var(--panel-2);
      cursor: pointer;
      transition: border-color .16s, background .16s, transform .16s, color .16s;
    }

    .btn:hover:not(:disabled) { border-color: var(--accent); background: var(--panel-3); }
    .btn:active:not(:disabled) { transform: scale(.97); }
    .btn:disabled { opacity: .36; cursor: not-allowed; }

    .btn-primary {
      border-color: rgba(41, 211, 226, .7);
      color: #061218;
      background: linear-gradient(135deg, #4ce5eb, #24c5d5);
      font-weight: 800;
    }

    .btn-primary:hover:not(:disabled) { color: #061218; background: linear-gradient(135deg, #71eef2, #31d1df); }

    .volume-row {
      display: grid;
      grid-template-columns: auto 1fr 42px;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
      color: var(--muted);
      font-size: 12px;
    }

    input[type="range"] { width: 100%; accent-color: var(--accent); }

    .format-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 18px;
    }

    .metric {
      padding: 11px 8px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(8, 16, 29, .38);
      text-align: center;
    }

    .metric strong { display: block; margin-bottom: 3px; color: var(--accent); font-size: 19px; }
    .metric span { color: var(--muted); font-size: 11px; }

    .access-record {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .access-record-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 9px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
    }

    .local-badge {
      padding: 3px 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 650;
    }

    .access-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .access-stats .metric strong { color: var(--success); }

    .shortcut-hint {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.55;
    }

    audio { display: none; }

    .channels-panel { min-width: 0; }

    .list-header {
      padding: 18px 18px 0;
      border-bottom: 1px solid var(--line);
    }

    .list-title-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .list-title-row h2 { margin: 0; font-size: 19px; }
    .list-title-row p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .result-count { color: var(--accent); font-size: 12px; font-weight: 750; white-space: nowrap; }

    .search-wrap { position: relative; margin-bottom: 14px; }

    .search-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      height: 44px;
      padding: 0 72px 0 40px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--text);
      background: #0b1524;
    }

    .search-input::placeholder { color: #71859e; }

    .search-key {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      padding: 3px 7px;
      border: 1px solid var(--line);
      border-radius: 5px;
      color: var(--muted);
      font-size: 10px;
    }

    .tabs {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      padding-bottom: 12px;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      min-height: 36px;
      padding: 0 12px;
      flex: 0 0 auto;
      border: 1px solid transparent;
      border-radius: 999px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }

    .tab:hover { color: var(--text); background: var(--panel-2); }
    .tab.active { border-color: rgba(41, 211, 226, .46); color: var(--accent); background: rgba(41, 211, 226, .09); }
    .tab-count { margin-left: 5px; opacity: .7; }

    .channel-list {
      max-height: calc(100vh - 185px);
      min-height: 400px;
      margin: 0;
      padding: 9px;
      overflow-y: auto;
      list-style: none;
    }

    .channel-row { position: relative; margin-bottom: 5px; }

    .channel {
      width: 100%;
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 12px 48px 12px 12px;
      border: 1px solid transparent;
      border-radius: 11px;
      color: var(--text);
      background: transparent;
      text-align: left;
      cursor: pointer;
      transition: background .16s, border-color .16s;
    }

    .channel:hover { border-color: var(--line); background: rgba(27, 42, 66, .7); }
    .channel.active { border-color: rgba(41, 211, 226, .62); background: rgba(41, 211, 226, .09); }

    .channel-icon {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: var(--panel-3);
      font-size: 18px;
    }

    .channel-info { min-width: 0; }
    .channel-info strong { display: block; overflow: hidden; margin-bottom: 4px; font-size: 14px; text-overflow: ellipsis; white-space: nowrap; }
    .ch-desc { display: block; overflow: hidden; color: var(--muted); font-size: 12px; line-height: 1.45; text-overflow: ellipsis; white-space: nowrap; }

    .ch-meta { display: flex; align-items: center; gap: 7px; }

    .badge {
      padding: 3px 7px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--muted);
      background: rgba(8, 16, 29, .4);
      font-size: 9px;
      font-weight: 800;
    }

    .region { color: var(--muted); font-size: 11px; }

    .favorite-btn {
      position: absolute;
      z-index: 2;
      right: 8px;
      top: 50%;
      width: 36px;
      height: 36px;
      transform: translateY(-50%);
      border: 0;
      border-radius: 9px;
      color: #6f849d;
      background: transparent;
      cursor: pointer;
      font-size: 19px;
    }

    .favorite-btn:hover { color: var(--warning); background: rgba(255, 189, 102, .08); }
    .favorite-btn.active { color: var(--warning); }

    .empty-state {
      display: grid;
      place-items: center;
      min-height: 280px;
      padding: 30px;
      color: var(--muted);
      text-align: center;
      line-height: 1.7;
    }

    .toast {
      position: fixed;
      z-index: 10;
      left: 50%;
      bottom: 26px;
      max-width: calc(100% - 32px);
      padding: 11px 16px;
      transform: translate(-50%, 20px);
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--text);
      background: #17253a;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s, transform .18s;
      font-size: 13px;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 820px) {
      .app { width: min(100% - 20px, 680px); padding-top: 12px; }
      .topbar { margin-bottom: 12px; }
      .top-status { display: none; }
      .brand-mark { width: 42px; height: 42px; }
      .brand p { display: none; }
      .shell { grid-template-columns: 1fr; gap: 12px; }
      .player { position: static; padding: 16px; }
      .now-playing { min-height: 0; padding: 15px; }
      .station-name { font-size: 20px; }
      .shortcut-hint { display: none; }
      .list-header { padding: 16px 12px 0; }
      .channel-list { max-height: none; min-height: 360px; padding: 7px; overflow: visible; }
      .channel { min-height: 68px; padding-left: 8px; }
    }

    @media (max-width: 480px) {
      .app { width: calc(100% - 12px); }
      h1 { font-size: 19px; }
      .player { padding: 12px; }
      .format-stats { margin-top: 12px; }
      .list-title-row { align-items: center; }
      .list-title-row p { display: none; }
      .channel { grid-template-columns: 38px minmax(0, 1fr); gap: 9px; padding-right: 44px; }
      .channel-icon { width: 38px; height: 38px; }
      .ch-meta { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">📻</div>
        <div>
          <h1>小伟网络电台</h1>
          <p>资讯、交通与音乐，一键收听</p>
        </div>
      </div>
      <div class="top-status" aria-live="polite">
        <span class="status-dot" id="topStatusDot"></span>
        <span id="topStatusText">等待选择频道</span>
      </div>
    </header>

    <div class="shell">
      <section class="player panel" aria-labelledby="playerHeading">
        <div class="eyebrow">
          <span id="playerHeading">正在播放</span>
          <span class="live-badge" id="liveBadge">待机</span>
        </div>

        <div class="now-playing">
          <div class="now-category" id="stationCategory">请选择频道</div>
          <h2 class="station-name" id="stationName">还没有播放内容</h2>
          <p class="station-desc" id="stationDesc">从右侧频道列表选择一个电台开始收听</p>
        </div>

        <div class="main-control">
          <button class="btn" id="prevBtn" type="button" disabled aria-label="上一个频道" title="上一个频道">←</button>
          <button class="btn btn-primary" id="playToggleBtn" type="button" disabled>▶ 播放</button>
          <button class="btn" id="nextBtn" type="button" disabled aria-label="下一个频道" title="下一个频道">→</button>
        </div>

        <div class="volume-row">
          <span>音量</span>
          <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="播放音量">
          <strong id="volumeText">80%</strong>
        </div>

        <div class="format-stats" aria-label="频道概览">
          <div class="metric"><strong id="stationTotal">0</strong><span>全部频道</span></div>
          <div class="metric"><strong id="favoriteTotal">0</strong><span>我的收藏</span></div>
          <div class="metric"><strong id="currentFormat">--</strong><span>当前格式</span></div>
        </div>

        <section class="access-record" aria-labelledby="accessRecordTitle">
          <h3 class="access-record-title" id="accessRecordTitle">
            <span>设备访问记录</span>
            <span class="local-badge">仅保存在本机浏览器</span>
          </h3>
          <div class="access-stats">
            <div class="metric"><strong id="todayVisits">-</strong><span>今日访问</span></div>
            <div class="metric"><strong id="todayVisitors">-</strong><span>今日设备</span></div>
            <div class="metric"><strong id="totalVisits">-</strong><span>累计访问</span></div>
          </div>
        </section>

        <p class="shortcut-hint">快捷键：空格播放/暂停 · ←/→ 切台 · / 搜索</p>
        <audio id="audio" preload="none"></audio>
      </section>

      <section class="channels-panel panel" aria-labelledby="channelHeading">
        <div class="list-header">
          <div class="list-title-row">
            <div>
              <h2 id="channelHeading">频道列表</h2>
              <p>按分类筛选，点击频道即可播放</p>
            </div>
            <span class="result-count" id="resultCount">0 个频道</span>
          </div>

          <div class="search-wrap">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input class="search-input" id="stationSearch" type="search" placeholder="搜索频道、地区或内容" autocomplete="off">
            <span class="search-key" aria-hidden="true">/ 搜索</span>
          </div>

          <nav class="tabs" id="tabs" aria-label="频道分类"></nav>
        </div>

        <ul class="channel-list" id="channelList" aria-live="polite"></ul>
      </section>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const categories = {
      news:    { label: "资讯", icon: "📰" },
      traffic: { label: "交通", icon: "🚗" },

    const stations = [

      { cat: "traffic", region: "上海", name: "上海交通广播 FM105.7", desc: "上海交通信息与都市服务", url: "https://lhttp.qtfm.cn/live/266/64k.mp3" },
      { cat: "traffic", region: "深圳", name: "深圳交通广播 FM106.2", desc: "深圳路况与交通服务", url: "https://lhttp.qtfm.cn/live/1271/64k.mp3" },

      { cat: "traffic", region: "四川", name: "四川交通广播 FM101.7", desc: "四川路况、汽车与出行服务", url: "https://lhttp.qtfm.cn/live/4886/64k.mp3" },
      { cat: "traffic", region: "湖北", name: "湖北楚天交通广播 FM92.7", desc: "湖北实时路况与交通资讯", url: "https://lhttp.qtfm.cn/live/1291/64k.mp3" },
      { cat: "traffic", region: "安徽", name: "安徽交通广播 FM90.8", desc: "安徽高速、城市路况与车主服务", url: "https://lhttp.qtfm.cn/live/1949/64k.mp3" },
      { cat: "traffic", region: "郑州", name: "郑州交通广播 FM91.2", desc: "郑州实时路况与出行提醒", url: "https://lhttp.qtfm.cn/live/1211/64k.mp3" },

      // 音乐
      { cat: "music", region: "全国", name: "CNR-3 音乐之声", desc: "流行音乐与音乐资讯", url: "https://satellitepull.cnr.cn/live/wxyyzs/playlist.m3u8" },
      { cat: "music", region: "北京", name: "北京音乐广播 FM97.4", desc: "北京经典流行音乐电台", url: "https://lhttp.qingting.fm/live/332/64k.mp3" },
      { cat: "music", region: "上海", name: "上海动感101", desc: "上海流行音乐广播", url: "https://lhttp.qingting.fm/live/274/64k.mp3" },
      { cat: "music", region: "华语", name: "华语金曲电台", desc: "经典华语流行音乐", url: "https://lhttp.qingting.fm/live/5022397/64k.mp3" },
      { cat: "music", region: "广东", name: "广东音乐之声", desc: "广东流行音乐频道", url: "https://lhttp.qtfm.cn/live/1254/64k.mp3" },
      { cat: "music", region: "深圳", name: "深圳飞扬971", desc: "深圳都市音乐广播", url: "https://lhttp.qtfm.cn/live/1270/64k.mp3" },
      { cat: "music", region: "江苏", name: "江苏音乐广播", desc: "江苏音乐与娱乐资讯", url: "https://lhttp.qtfm.cn/live/4915/64k.mp3" },
      { cat: "music", region: "浙江", name: "浙江音乐调频968", desc: "浙江流行音乐广播", url: "https://lhttp.qtfm.cn/live/4522/64k.mp3" },
      { cat: "music", region: "天津", name: "天津音乐广播 FM99", desc: "天津经典音乐电台", url: "https://lhttp.qingting.fm/live/5022062/64k.mp3" },
      { cat: "music", region: "国际", name: "Radio Paradise", desc: "世界音乐、摇滚与民谣", url: "https://stream.radioparadise.com/aac-320" },

      // 综合
      { cat: "general", region: "全国", name: "CNR-5 中华之声", desc: "两岸资讯与文化节目", url: "https://lhttp.qingting.fm/live/4976/64k.mp3" },
      { cat: "general", region: "湾区", name: "CNR-7 华夏之声", desc: "粤港澳大湾区资讯", url: "https://lhttp.qingting.fm/live/5022025/64k.mp3" },
      { cat: "general", region: "国际", name: "CRI HIT FM 88.7", desc: "国际流行音乐（双语）", url: "https://lhttp.qingting.fm/live/1161/64k.mp3" },
    ];

    const FAVORITES_KEY = "xiaowei-radio-favorites-v2";
    const RECENTS_KEY = "xiaowei-radio-recents-v2";
    const VOLUME_KEY = "xiaowei-radio-volume-v2";
    const ACCESS_STATS_KEY = "***";

    const audio = document.getElementById("audio");
    const channelList = document.getElementById("channelList");
    const tabsRow = document.getElementById("tabs");
    const searchInput = document.getElementById("stationSearch");
    const playToggleBtn = document.getElementById("playToggleBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const volume = document.getElementById("volume");
    const volumeText = document.getElementById("volumeText");
    const toast = document.getElementById("toast");

    let hls = null;
    let currentIndex = -1;
    let activeCat = "all";
    let toastTimer = null;
    let favorites = loadStoredArray(FAVORITES_KEY);
    let recents = loadStoredArray(RECENTS_KEY);

    function loadStoredArray(key) {
      try {
        const value = JSON.parse(localStorage.getItem(key));
        return Array.isArray(value) ? value.filter(Number.isInteger) : [];
      } catch {
        return [];
      }
    }

    function isHls(url) { return /\.m3u8($|\?)/i.test(url); }
    function stationFormat(station) { return isHls(station.url) ? "HLS" : "MP3"; }

    function setStatus(text, state = "") {
      document.getElementById("topStatusText").textContent = text;
      document.getElementById("topStatusDot").className = `status-dot${state ? ` ${state}` : ""}`;
      const badge = document.getElementById("liveBadge");
      badge.textContent = text;
      badge.style.color = state === "error" ? "var(--danger)" : state === "loading" ? "var(--warning)" : "var(--success)";
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      window.clearTimeout(toastTimer);
      toastTimer = window.setTimeout(() => toast.classList.remove("show"), 1800);
    }

    function updateMetrics() {
      document.getElementById("stationTotal").textContent = stations.length;
      document.getElementById("favoriteTotal").textContent = favorites.length;
      document.getElementById("currentFormat").textContent = currentIndex >= 0 ? stationFormat(stations[currentIndex]) : "--";
    }

    function updateAccessStats() {
      const now = new Date();
      const today = [
        now.getFullYear(),
        String(now.getMonth() + 1).padStart(2, "0"),
        String(now.getDate()).padStart(2, "0"),
      ].join("-");

      let data;
      try { data = JSON.parse(localStorage.getItem(ACCESS_STATS_KEY)) || {}; } catch { data = {}; }

      if (!data.visitorId) {
        data.visitorId = crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2);
      }
      if (!data.days) data.days = {};

      const day = data.days[today] || { visits: 0, visitors: [] };
      day.visits += 1;
      if (!Array.isArray(day.visitors)) day.visitors = [];
      if (!day.visitors.includes(data.visitorId)) day.visitors.push(data.visitorId);
      data.days[today] = day;

      const totalVisits = Object.values(data.days).reduce((total, item) => total + (Number(item.visits) || 0), 0);
      localStorage.setItem(ACCESS_STATS_KEY, JSON.stringify(data));

      document.getElementById("todayVisits").textContent = day.visits;
      document.getElementById("todayVisitors").textContent = day.visitors.length;
      document.getElementById("totalVisits").textContent = totalVisits;
    }

    function renderTabs() {
      const counts = { all: stations.length, favorites: favorites.length, recent: recents.length };
      stations.forEach(station => { counts[station.cat] = (counts[station.cat] || 0) + 1; });
      const tabs = [
        ["all", "全部"],
        ["favorites", "★ 收藏"],
        ["recent", "最近"],
        ...Object.entries(categories).map(([key, value]) => [key, `${value.icon} ${value.label}`]),
      ];

      tabsRow.innerHTML = tabs.map(([key, label]) => `
        <button class="tab${activeCat === key ? " active" : ""}" type="button" data-cat="${key}" aria-pressed="${activeCat === key}">
          ${label}<span class="tab-count">${counts[key] || 0}</span>
        </button>
      `).join("");
    }

    function filteredIndexes() {
      const query = searchInput.value.trim().toLowerCase();
      const base = activeCat === "favorites"
        ? favorites
        : activeCat === "recent"
          ? recents
          : stations.map((_, index) => index);

      return base.filter(index => {
        const station = stations[index];
        if (!station) return false;
        if (!['all', 'favorites', 'recent'].includes(activeCat) && station.cat !== activeCat) return false;
        if (!query) return true;
        return `${station.name} ${station.desc} ${station.region} ${categories[station.cat].label}`.toLowerCase().includes(query);
      });
    }

    function renderStations() {
      const indexes = filteredIndexes();
      document.getElementById("resultCount").textContent = `${indexes.length} 个频道`;

      if (!indexes.length) {
        const message = activeCat === "favorites"
          ? "还没有收藏频道<br>点击频道右侧的星标即可收藏"
          : activeCat === "recent"
            ? "还没有最近收听记录"
            : "没有找到匹配的频道<br>请尝试更短的关键词";
        channelList.innerHTML = `<li class="empty-state">${message}</li>`;
        return;
      }

      channelList.innerHTML = indexes.map(index => {
        const station = stations[index];
        const category = categories[station.cat];
        const isFavorite = favorites.includes(index);
        return `
          <li class="channel-row">
            <button class="channel${currentIndex === index ? " active" : ""}" type="button" data-index="${index}" aria-label="播放 ${station.name}">
              <span class="channel-icon" aria-hidden="true">${category.icon}</span>
              <span class="channel-info">
                <strong>${station.name}</strong>
                <span class="ch-desc">${station.desc}</span>
              </span>
              <span class="ch-meta"><span class="region">${station.region}</span><span class="badge">${stationFormat(station)}</span></span>
            </button>
            <button class="favorite-btn${isFavorite ? " active" : ""}" type="button" data-favorite-index="${index}" aria-label="${isFavorite ? "取消收藏" : "收藏"} ${station.name}" title="${isFavorite ? "取消收藏" : "收藏"}">${isFavorite ? "★" : "☆"}</button>
          </li>
        `;
      }).join("");
    }

    function destroyHls() {
      if (hls) {
        hls.destroy();
        hls = null;
      }
    }

    async function playCurrent() {
      if (currentIndex < 0) return;
      setStatus("连接中", "loading");
      try {
        await audio.play();
      } catch (error) {
        setStatus(error.name === "NotAllowedError" ? "请点击播放" : "播放失败", "error");
      }
    }

    function updatePlayer(station) {
      document.getElementById("stationCategory").textContent = `${categories[station.cat].icon} ${categories[station.cat].label} · ${station.region}`;
      document.getElementById("stationName").textContent = station.name;
      document.getElementById("stationDesc").textContent = station.desc;
      playToggleBtn.disabled = false;
      prevBtn.disabled = false;
      nextBtn.disabled = false;
      updateMetrics();
    }

    function rememberRecent(index) {
      recents = [index, ...recents.filter(item => item !== index)].slice(0, 8);
      localStorage.setItem(RECENTS_KEY, JSON.stringify(recents));
    }

    function loadStation(index) {
      const station = stations[index];
      if (!station) return;

      currentIndex = index;
      rememberRecent(index);
      renderTabs();
      renderStations();
      updatePlayer(station);
      destroyHls();
      audio.pause();
      audio.removeAttribute("src");
      audio.load();
      setStatus("连接中", "loading");

      if (isHls(station.url) && window.Hls && Hls.isSupported()) {
        hls = new Hls({ enableWorker: true, lowLatencyMode: false });
        hls.loadSource(station.url);
        hls.attachMedia(audio);
        hls.on(Hls.Events.MANIFEST_PARSED, playCurrent);
        hls.on(Hls.Events.ERROR, (_event, data) => {
          if (!data.fatal) return;
          if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
            setStatus("音源连接失败", "error");
          } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
            hls.recoverMediaError();
          } else {
            setStatus("HLS 解码失败", "error");
          }
        });
      } else {
        audio.src = station.url;
        playCurrent();
      }
    }

    function togglePlayback() {
      if (currentIndex < 0) return;
      if (audio.paused) playCurrent();
      else audio.pause();
    }

    function stepStation(direction) {
      const visible = filteredIndexes();
      if (!visible.length) return;
      const position = visible.indexOf(currentIndex);
      const nextPosition = position < 0 ? 0 : (position + direction + visible.length) % visible.length;
      loadStation(visible[nextPosition]);
    }

    function toggleFavorite(index) {
      const wasFavorite = favorites.includes(index);
      favorites = wasFavorite ? favorites.filter(item => item !== index) : [index, ...favorites];
      localStorage.setItem(FAVORITES_KEY, JSON.stringify(favorites));
      showToast(wasFavorite ? `已取消收藏：${stations[index].name}` : `已收藏：${stations[index].name}`);
      updateMetrics();
      renderTabs();
      renderStations();
    }

    tabsRow.addEventListener("click", event => {
      const tab = event.target.closest(".tab");
      if (!tab) return;
      activeCat = tab.dataset.cat;
      renderTabs();
      renderStations();
    });

    channelList.addEventListener("click", event => {
      const favoriteButton = event.target.closest("[data-favorite-index]");
      if (favoriteButton) {
        toggleFavorite(Number(favoriteButton.dataset.favoriteIndex));
        return;
      }
      const channel = event.target.closest(".channel");
      if (channel) loadStation(Number(channel.dataset.index));
    });

    searchInput.addEventListener("input", renderStations);
    playToggleBtn.addEventListener("click", togglePlayback);
    prevBtn.addEventListener("click", () => stepStation(-1));
    nextBtn.addEventListener("click", () => stepStation(1));

    volume.addEventListener("input", () => {
      audio.volume = Number(volume.value);
      volumeText.textContent = `${Math.round(audio.volume * 100)}%`;
      localStorage.setItem(VOLUME_KEY, volume.value);
    });

    audio.addEventListener("playing", () => {
      setStatus("直播中", "playing");
      playToggleBtn.textContent = "⏸ 暂停";
    });
    audio.addEventListener("waiting", () => setStatus("缓冲中", "loading"));
    audio.addEventListener("pause", () => {
      if (currentIndex < 0) return;
      setStatus("已暂停");
      playToggleBtn.textContent = "▶ 继续播放";
    });
    audio.addEventListener("error", () => {
      setStatus("音源暂时不可用", "error");
      playToggleBtn.textContent = "↻ 重试播放";
    });

    document.addEventListener("keydown", event => {
      const typing = event.target.matches("input, textarea");
      if (event.key === "/" && !typing) {
        event.preventDefault();
        searchInput.focus();
      } else if (event.code === "Space" && !typing) {
        event.preventDefault();
        togglePlayback();
      } else if (event.key === "ArrowLeft" && !typing) {
        event.preventDefault();
        stepStation(-1);
      } else if (event.key === "ArrowRight" && !typing) {
        event.preventDefault();
        stepStation(1);
      } else if (event.key === "Escape" && document.activeElement === searchInput) {
        searchInput.value = "";
        searchInput.blur();
        renderStations();
      }
    });

    const storedVolumeValue = localStorage.getItem(VOLUME_KEY);
    const storedVolume = Number(storedVolumeValue);
    if (storedVolumeValue !== null && Number.isFinite(storedVolume) && storedVolume >= 0 && storedVolume <= 1) {
      volume.value = String(storedVolume);
    }
    audio.volume = Number(volume.value);
    volumeText.textContent = `${Math.round(audio.volume * 100)}%`;

    renderTabs();
    renderStations();
    updateMetrics();
    updateAccessStats();
  </script>
</body>
</html>
