name: Check radio stations

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "scripts/check_stations.py"
      - ".github/workflows/check-stations.yml"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: radio-station-health
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Repair known inactive station sources
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          replacements = {
              '{ cat: "traffic", region: "湖北", name: "湖北楚天交通广播 FM92.7", desc: "湖北实时路况与交通资讯", url: "https://lhttp.qtfm.cn/live/1291/64k.mp3" }':
              '{ cat: "traffic", region: "湖北", name: "湖北楚天交通广播 FM92.7", desc: "湖北实时路况与交通资讯", url: "https://ls.qingting.fm/live/1291.m3u8" }',
              '{ cat: "traffic", region: "广东", name: "茂名交通广播", desc: "茂名路况、交通与本地服务", url: "https://lhttp.qingting.fm/live/20211574/64k.mp3" }':
              '{ cat: "general", region: "广东", name: "茂名综合广播 FM101.1", desc: "茂名新闻、民生与本地综合服务", url: "https://lhttp.qtfm.cn/live/1806/64k.mp3" }',
          }
          changed = False
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
                  changed = True
          if changed:
              p.write_text(text, encoding='utf-8')
              print('Replaced inactive station sources')
          else:
              print('No known inactive station sources found')
          PY

      - name: Check station streams
        run: python scripts/check_stations.py index.html station-health.json --timeout 12 --workers 10

      - name: Show unavailable stations
        run: |
          python - <<'PY'
          import json
          data = json.load(open('station-health.json', encoding='utf-8'))
          bad = [(name, item) for name, item in data['stations'].items() if not item['ok']]
          print(f"Available: {data['availableCount']}/{data['stationCount']}")
          for name, item in bad:
              print(f"DOWN\t{name}\tstatus={item['status']}\terror={item['error']}\tlatency={item['latencyMs']}ms")
          PY

      - name: Commit station updates and health report
        run: |
          if git diff --quiet -- index.html station-health.json; then
            echo "Station data unchanged"
            exit 0
          fi
          git config user.name "radio-health[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html station-health.json
          git commit -m "fix: refresh inactive radio sources [skip ci]"
          git push
