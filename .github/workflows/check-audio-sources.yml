name: Check audiobook and podcast sources

on:
  workflow_dispatch:
  push:
    paths:
      - "data/audiobook_feeds.json"
      - "data/podcast_feeds.json"
      - "scripts/check_audio_sources.py"
      - ".github/workflows/check-audio-sources.yml"
  schedule:
    - cron: "43 3 * * *"

permissions:
  contents: write

concurrency:
  group: radio-audio-source-health
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check audiobook and podcast feeds
        run: python scripts/check_audio_sources.py --timeout 15 --workers 8 --sample-count 2

      - name: Show unavailable sources
        run: |
          python - <<'PY'
          import json
          data = json.load(open('audio-source-health.json', encoding='utf-8'))
          bad = [(name, item) for name, item in data['sources'].items() if not item['ok']]
          print(f"Available: {data['availableCount']}/{data['sourceCount']}")
          for name, item in bad:
              print(f"DOWN\t{name}\tfeed={item['feedStatus']}\taudio={item['audioPassed']}/{item['audioChecked']}\terror={item['error']}")
          PY

      - name: Commit health report
        run: |
          if git diff --quiet -- audio-source-health.json; then
            echo "Audio source health report unchanged"
            exit 0
          fi
          git config user.name "audio-health[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio-source-health.json
          git commit -m "chore: refresh audiobook and podcast health [skip ci]"
          git push
