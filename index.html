<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小伟的快乐加油站 ⚡</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg: #0a0e17;
      --panel: #0f1520;
      --panel-2: #162030;
      --text: #e0f0ff;
      --muted: #6a8aaa;
      --line: #1e3048;
      --accent: #00e5ff;
      --accent-2: #39ff14;
      --danger: #ff3b5c;
      --glow: 0 0 18px rgba(0,229,255,.3);
      --glow-green: 0 0 14px rgba(57,255,20,.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    @font-face {
      font-family: 'SciFi';
      src: local('Orbitron');
      /* fallback: system mono */
    }

    body {
      min-height: 100vh;
      font-family: "Courier New", "Menlo", "SF Mono", monospace;
      color: var(--text);
      background:
        /* grid lines */
        linear-gradient(rgba(0,229,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,.03) 1px, transparent 1px),
        /* radial glow */
        radial-gradient(ellipse at 50% 0%, rgba(0,229,255,.08) 0%, transparent 60%),
        radial-gradient(ellipse at 20% 80%, rgba(57,255,20,.04) 0%, transparent 50%),
        var(--bg);
      background-size: 40px 40px, 40px 40px, 100% 100%, 100% 100%;
      /* scanline */
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(0,0,0,.03) 2px, rgba(0,0,0,.03) 4px
      );
    }

    main {
      width: min(1200px, calc(100% - 24px));
      margin: 0 auto;
      padding: 32px 0 48px;
    }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .avatar {
      width: clamp(60px, 10vw, 90px);
      height: auto;
      margin-bottom: 8px;
      filter: drop-shadow(0 0 16px rgba(247,211,78,.35));
    }

    .scanline-text {
      display: inline-block;
      font-size: clamp(24px, 5vw, 46px);
      font-weight: 900;
      letter-spacing: 4px;
      background: linear-gradient(180deg, var(--accent) 0%, #0088aa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
      filter: drop-shadow(0 0 20px rgba(0,229,255,.4));
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: .7;
    }

    /* ── Layout ── */
    .shell {
      display: grid;
      grid-template-columns: minmax(0, 400px) minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }

    /* ── Panel Base ── */
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      position: relative;
      overflow: hidden;
    }

    .panel::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: .5;
    }

    /* ── Player ── */
    .player {
      position: sticky;
      top: 24px;
      padding: 28px 24px;
    }

    .now-playing {
      padding: 20px;
      margin: 8px 0 20px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: rgba(0,229,255,.04);
      position: relative;
    }

    .now-playing::after {
      content: "⚡ ON AIR";
      position: absolute;
      top: -9px;
      left: 12px;
      background: var(--panel);
      padding: 0 8px;
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--accent);
      opacity: .8;
    }

    .station-name {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
      line-height: 1.3;
      color: #fff;
    }

    .station-desc {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }
    .dot.playing { background: var(--accent-2); box-shadow: 0 0 8px var(--accent-2); }
    .dot.error { background: var(--danger); box-shadow: 0 0 8px var(--danger); }

    /* ── Controls ── */
    .controls { margin-top: 18px; }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .btn {
      border: 1px solid var(--line);
      border-radius: 4px;
      min-height: 44px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all .15s;
      color: var(--text);
      background: var(--panel-2);
      letter-spacing: 1px;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .3; cursor: not-allowed; border-color: var(--line); color: var(--muted); }

    .btn-primary {
      background: rgba(0,229,255,.1);
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: var(--glow);
    }
    .btn-primary:hover { background: rgba(0,229,255,.18); }

    .vol-group {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: var(--muted);
    }

    .vol-label {
      letter-spacing: 2px;
    }

    .vol-value {
      min-width: 36px;
      color: var(--accent);
      font-weight: 700;
      text-align: right;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      height: 4px;
    }

    audio {
      width: 100%;
      margin-top: 18px;
      height: 36px;
      border-radius: 4px;
      opacity: .85;
    }

    /* ── Stats ── */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 20px;
      padding: 14px 12px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: rgba(0,0,0,.2);
    }

    .stat-item {
      text-align: center;
    }

    .stat-label {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 900;
      color: var(--accent);
      text-shadow: 0 0 10px rgba(0,229,255,.3);
    }

    /* ── Channels Panel ── */
    .channels-panel {
      padding: 0;
    }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      gap: 0;
      overflow-x: auto;
      scrollbar-width: none;
      border-bottom: 1px solid var(--line);
      padding: 0 4px;
      -webkit-overflow-scrolling: touch;
    }

    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      flex-shrink: 0;
      padding: 12px 16px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--muted);
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: all .15s;
    }

    .tab:hover { color: var(--text); }
    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      text-shadow: 0 0 8px rgba(0,229,255,.3);
    }

    .tab-count {
      margin-left: 4px;
      font-size: 11px;
      opacity: .6;
    }

    /* ── Channel List ── */
    .channel-list {
      list-style: none;
      padding: 8px;
    }

    .channel {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 14px 16px;
      margin-bottom: 4px;
      text-align: left;
      border: 1px solid transparent;
      border-radius: 4px;
      background: transparent;
      color: var(--text);
      font-family: inherit;
      cursor: pointer;
      transition: all .15s;
    }

    .channel:hover {
      background: rgba(0,229,255,.04);
      border-color: rgba(0,229,255,.15);
    }

    .channel.active {
      background: rgba(0,229,255,.08);
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(0,229,255,.1);
    }

    .channel-info strong {
      display: block;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 3px;
      letter-spacing: .5px;
    }

    .channel-info .ch-desc {
      display: block;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }

    .ch-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .badge {
      padding: 3px 10px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      border: 1px solid;
    }

    /* Format badges */
    .badge-hls {
      color: var(--accent-2);
      border-color: rgba(57,255,20,.3);
      background: rgba(57,255,20,.06);
    }

    .badge-mp3 {
      color: var(--accent);
      border-color: rgba(0,229,255,.3);
      background: rgba(0,229,255,.06);
    }

    /* Category tags */
    .cat-tag {
      padding: 2px 8px;
      border-radius: 2px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .cat-news    { color: #ff6b9d; border: 1px solid rgba(255,107,157,.3); }
    .cat-music   { color: var(--accent-2); border: 1px solid rgba(57,255,20,.3); }
    .cat-traffic { color: #ff9f43; border: 1px solid rgba(255,159,67,.3); }
    .cat-general { color: #a29bfe; border: 1px solid rgba(162,155,254,.3); }

    .hint {
      margin-top: 16px;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.6;
      letter-spacing: .5px;
    }

    /* ── Mobile Adapt ── */
    @media (max-width: 768px) {
      body { font-size: 14px; }
      main { padding: 16px 0 32px; }

      .shell {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .player {
        position: static;
        padding: 20px 16px;
      }

      .now-playing {
        padding: 16px;
        margin: 4px 0 16px;
      }

      .station-name { font-size: 20px; }

      .btn {
        min-height: 48px;
        font-size: 16px;
      }

      .stats {
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        padding: 12px 8px;
      }

      .stat-value { font-size: 18px; }

      .tab {
        padding: 10px 12px;
        font-size: 12px;
      }

      .channel {
        padding: 12px 12px;
      }

      .channel-info strong { font-size: 14px; }

      .channels-panel {
        border-radius: 6px;
      }
    }

    @media (max-width: 400px) {
      .btn-row { grid-template-columns: 1fr; }
      .stats { grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 10px 6px; }
      .stat-label { font-size: 9px; letter-spacing: 1px; }
      .stat-value { font-size: 16px; }
    }

    /* ── Tablet ── */
    @media (min-width: 769px) and (max-width: 1024px) {
      .shell {
        grid-template-columns: minmax(0, 360px) minmax(0, 1fr);
      }
    }
  </style>
</head>
<body>
  <main>
    <!-- Header -->
    <div class="header">
      <svg class="avatar" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <!-- face -->
        <ellipse cx="60" cy="65" rx="50" ry="48" fill="#F7D34E" stroke="#D4A017" stroke-width="3"/>
        <!-- cheeks -->
        <circle cx="24" cy="72" r="10" fill="#FF6B4A" opacity=".85"/>
        <circle cx="96" cy="72" r="10" fill="#FF6B4A" opacity=".85"/>
        <!-- ears -->
        <ellipse cx="16" cy="18" rx="16" ry="28" fill="#F7D34E" stroke="#D4A017" stroke-width="3" transform="rotate(-18 16 18)"/>
        <ellipse cx="104" cy="18" rx="16" ry="28" fill="#F7D34E" stroke="#D4A017" stroke-width="3" transform="rotate(18 104 18)"/>
        <!-- ear tips (black) -->
        <ellipse cx="16" cy="-2" rx="9" ry="12" fill="#222" transform="rotate(-18 16 -2)"/>
        <ellipse cx="104" cy="-2" rx="9" ry="12" fill="#222" transform="rotate(18 104 -2)"/>
        <!-- eyes -->
        <circle cx="43" cy="52" r="7" fill="#222"/>
        <circle cx="77" cy="52" r="7" fill="#222"/>
        <circle cx="45" cy="50" r="2.5" fill="#fff"/>
        <circle cx="79" cy="50" r="2.5" fill="#fff"/>
        <!-- nose -->
        <ellipse cx="60" cy="62" rx="3" ry="2" fill="#222"/>
        <!-- mouth -->
        <path d="M50 70 Q60 80 70 70" fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
        <!-- top head highlight -->
        <ellipse cx="60" cy="38" rx="30" ry="12" fill="rgba(255,255,255,.2)"/>
      </svg>
      <div class="scanline-text">⚡ 小伟的快乐加油站</div>
      <div class="subtitle">XIAOWEI'S HAPPY FUEL STATION</div>
    </div>

    <div class="shell">
      <!-- Player -->
      <section class="player panel">
        <div class="now-playing">
          <div class="station-name" id="stationName">选择频道</div>
          <div class="station-desc" id="stationDesc">点击右侧列表开始收听</div>
          <div class="status-row">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">待机中</span>
          </div>
        </div>

        <div class="controls">
          <div class="btn-row">
            <button class="btn btn-primary" id="playBtn" disabled>▶ PLAY</button>
            <button class="btn" id="pauseBtn" disabled>⏸ PAUSE</button>
          </div>
          <div class="vol-group">
            <span class="vol-label">VOL</span>
            <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8">
            <span class="vol-value" id="volumeText">80%</span>
          </div>
        </div>

        <audio id="audio" controls preload="none"></audio>

        <!-- Stats -->
        <div class="stats" id="stats">
          <div class="stat-item">
            <div class="stat-label">今日访问</div>
            <div class="stat-value" id="todayVisits">-</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">今日访客</div>
            <div class="stat-value" id="todayVisitors">-</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">累计</div>
            <div class="stat-value" id="totalVisits">-</div>
          </div>
        </div>

        <p class="hint">// HLS(m3u8) 通过 HLS.js 解码 · 部分 HTTP 音源可能被浏览器拦截 · 建议使用 HTTPS 环境下打开</p>
      </section>

      <!-- Channels -->
      <section class="channels-panel panel">
        <div class="tabs" id="tabs"></div>
        <ul class="channel-list" id="channelList"></ul>
      </section>
    </div>
  </main>

  <script>
    // ── Category defs ──
    const categories = {
      news:    { label: "📡 资讯", cls: "cat-news" },
      music:   { label: "🎵 音乐", cls: "cat-music" },
      traffic: { label: "🚗 交通", cls: "cat-traffic" },
      general: { label: "🌐 综合", cls: "cat-general" },
    };

    // ── Stations ──
    const stations = [
      // 资讯
      { cat: "news", name: "CNR-1 中国之声",        desc: "中央广播电视总台 · 新闻综合",  url: "https://lhttp.qtfm.cn/live/15318317/64k.mp3" },
      { cat: "news", name: "CNR-2 经济之声",        desc: "中央广播电视总台 · 财经新闻",  url: "https://lhttp.qtfm.cn/live/15318318/64k.mp3" },
      { cat: "news", name: "BBC World Service",     desc: "国际新闻与全球专题 (英语)",     url: "https://a.files.bbci.co.uk/media/live/manifesto/audio/simulcast/hls/nonuk/sbr_low/ak/bbc_world_service.m3u8" },
      { cat: "news", name: "轻松调频 CRI EZFM",     desc: "英语资讯与轻松音乐",             url: "https://sk.cri.cn/905.m3u8" },
      { cat: "news", name: "环球资讯广播",           desc: "国际新闻深度报道",               url: "https://lhttp.qtfm.cn/live/1170/64k.mp3" },
      // 音乐
      { cat: "music", name: "CNR-3 音乐之声",        desc: "流行音乐与音乐资讯",             url: "https://satellitepull.cnr.cn/live/wxyyzs/playlist.m3u8" },
      { cat: "music", name: "CNR-15 经典音乐广播",   desc: "经典老歌与怀旧金曲",             url: "https://lhttp.qtfm.cn/live/386/64k.mp3" },
      { cat: "music", name: "上海动感101",           desc: "上海流行音乐广播",               url: "https://lhttp.qingting.fm/live/274/64k.mp3" },
      { cat: "music", name: "华语金曲电台",          desc: "经典华语流行音乐",               url: "https://lhttp.qingting.fm/live/5022397/64k.mp3" },
      { cat: "music", name: "广东音乐之声",          desc: "广东流行音乐频道",               url: "https://lhttp.qtfm.cn/live/1254/64k.mp3" },
      { cat: "music", name: "深圳飞扬971",          desc: "深圳都市音乐广播",               url: "https://lhttp.qtfm.cn/live/1270/64k.mp3" },
      { cat: "music", name: "江苏音乐广播",          desc: "江苏音乐与娱乐资讯",             url: "https://lhttp.qtfm.cn/live/4915/64k.mp3" },
      { cat: "music", name: "浙江音乐调频 968",     desc: "浙江流行音乐广播",               url: "https://lhttp.qtfm.cn/live/4522/64k.mp3" },
      { cat: "music", name: "天津音乐广播 99",      desc: "天津经典音乐电台",               url: "https://lhttp.qtfm.cn/live/377/64k.mp3" },
      // 交通
      { cat: "traffic", name: "北京交通广播 103.9",  desc: "北京路况信息与出行服务",         url: "https://lhttp.qtfm.cn/live/335/64k.mp3" },
      { cat: "traffic", name: "上海交通广播 105.7",  desc: "上海交通信息与都市资讯",         url: "https://lhttp.qtfm.cn/live/275/64k.mp3" },
      { cat: "traffic", name: "深圳交通广播 106.2",  desc: "深圳路况与交通服务",             url: "https://lhttp.qtfm.cn/live/1271/64k.mp3" },
      { cat: "traffic", name: "中国交通广播",        desc: "全国高速路况与出行指南",         url: "https://lhttp.qtfm.cn/live/4952/64k.mp3" },
      // 综合
      { cat: "general", name: "CNR-5 中华之声",      desc: "对台广播 · 两岸资讯",           url: "https://lhttp.qtfm.cn/live/15318321/64k.mp3" },
      { cat: "general", name: "CNR-7 华夏之声",      desc: "粤港澳大湾区资讯",               url: "https://lhttp.qtfm.cn/live/15318323/64k.mp3" },
      { cat: "general", name: "CRI HIT FM 88.7",    desc: "国际流行音乐 (双语)",             url: "https://sk.cri.cn/887.m3u8" },
    ];

    // ── DOM ──
    const audio = document.getElementById("audio");
    const elName = document.getElementById("stationName");
    const elDesc = document.getElementById("stationDesc");
    const elStatus = document.getElementById("statusText");
    const elDot = document.getElementById("statusDot");
    const channelList = document.getElementById("channelList");
    const tabsRow = document.getElementById("tabs");
    const playBtn = document.getElementById("playBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const volume = document.getElementById("volume");
    const volumeText = document.getElementById("volumeText");

    let hls = null;
    let currentIndex = -1;
    let activeCat = "all";

    function isHls(url) { return /\.m3u8($|\?)/i.test(url); }

    function setStatus(text, state) {
      elStatus.textContent = text;
      elDot.className = "dot" + (state ? ` ${state}` : "");
    }

    // ── Tabs ──
    function renderTabs() {
      const counts = { all: stations.length };
      stations.forEach(s => { counts[s.cat] = (counts[s.cat] || 0) + 1; });

      let html = `<button class="tab active" data-cat="all">ALL<span class="tab-count">${counts.all}</span></button>`;
      for (const [key, cat] of Object.entries(categories)) {
        html += `<button class="tab" data-cat="${key}">${cat.label}<span class="tab-count">${counts[key] || 0}</span></button>`;
      }
      tabsRow.innerHTML = html;

      tabsRow.addEventListener("click", (e) => {
        const tab = e.target.closest(".tab");
        if (!tab) return;
        activeCat = tab.dataset.cat;
        tabsRow.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t === tab));
        renderStations();
      });
    }

    function renderStations() {
      const items = [];
      stations.forEach((s, i) => {
        if (activeCat !== "all" && s.cat !== activeCat) return;
        const type = isHls(s.url) ? "HLS" : "MP3";
        const badgeCls = type === "HLS" ? "badge-hls" : "badge-mp3";
        const catInfo = categories[s.cat];
        items.push(`
          <li>
            <button class="channel" type="button" data-index="${i}">
              <span class="channel-info">
                <strong>${s.name}</strong>
                <span class="ch-desc">${s.desc}</span>
              </span>
              <span class="ch-meta">
                <span class="badge ${badgeCls}">${type}</span>
                <span class="cat-tag ${catInfo.cls}">${catInfo.label}</span>
              </span>
            </button>
          </li>
        `);
      });

      channelList.innerHTML = items.length
        ? items.join("")
        : '<li style="padding:32px;color:var(--muted);text-align:center;font-size:13px;letter-spacing:1px">// NO STATIONS IN THIS CATEGORY</li>';
      markActive();
    }

    function markActive() {
      channelList.querySelectorAll(".channel").forEach(btn => {
        btn.classList.toggle("active", Number(btn.dataset.index) === currentIndex);
      });
    }

    function destroyHls() {
      if (hls) { hls.destroy(); hls = null; }
    }

    async function playCurrent() {
      try {
        await audio.play();
        setStatus("LIVE", "playing");
      } catch (err) {
        setStatus("ERR: 播放被拦截", "error");
      }
    }

    function loadStation(index) {
      const s = stations[index];
      currentIndex = index;
      markActive();
      destroyHls();
      audio.pause();
      audio.removeAttribute("src");
      audio.load();

      elName.textContent = s.name;
      elDesc.textContent = s.desc;
      playBtn.disabled = false;
      pauseBtn.disabled = false;
      setStatus("CONNECTING...", "");

      if (isHls(s.url) && window.Hls && Hls.isSupported()) {
        hls = new Hls({ enableWorker: true, lowLatencyMode: false });
        hls.loadSource(s.url);
        hls.attachMedia(audio);
        hls.on(Hls.Events.MANIFEST_PARSED, playCurrent);
        hls.on(Hls.Events.ERROR, (_e, d) => {
          if (d.fatal) setStatus("ERR: HLS 解码失败", "error");
        });
      } else {
        audio.src = s.url;
        playCurrent();
      }
    }

    channelList.addEventListener("click", (e) => {
      const btn = e.target.closest(".channel");
      if (!btn) return;
      loadStation(Number(btn.dataset.index));
    });

    playBtn.addEventListener("click", playCurrent);
    pauseBtn.addEventListener("click", () => { audio.pause(); setStatus("PAUSED", ""); });

    volume.addEventListener("input", () => {
      audio.volume = Number(volume.value);
      volumeText.textContent = `${Math.round(audio.volume * 100)}%`;
    });

    audio.addEventListener("playing", () => setStatus("LIVE", "playing"));
    audio.addEventListener("waiting", () => setStatus("BUFFERING...", ""));
    audio.addEventListener("pause", () => { if (currentIndex >= 0) setStatus("PAUSED", ""); });
    audio.addEventListener("error", () => setStatus("ERR: 音源不可达", "error"));

    audio.volume = Number(volume.value);

    // ── Stats (localStorage) ──
    function updateStats() {
      const KEY = "***";
      const today = new Date().toISOString().slice(0, 10);

      let data;
      try { data = JSON.parse(localStorage.getItem(KEY)) || {}; } catch { data = {}; }

      if (!data.visitorId) data.visitorId = crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2);
      if (!data.days) data.days = {};

      const day = data.days[today] || { visits: 0, visitors: [] };
      day.visits += 1;
      if (!day.visitors.includes(data.visitorId)) day.visitors.push(data.visitorId);
      data.days[today] = day;

      let total = 0;
      for (const d of Object.values(data.days)) total += d.visits || 0;

      localStorage.setItem(KEY, JSON.stringify(data));

      document.getElementById("todayVisits").textContent = day.visits;
      document.getElementById("todayVisitors").textContent = day.visitors.length;
      document.getElementById("totalVisits").textContent = total;
    }

    // ── Init ──
    renderTabs();
    renderStations();
    updateStats();
  </script>
</body>
</html>
